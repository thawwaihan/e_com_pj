<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag & Checkout | Atelier Boutique</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-black: #0a0a0c;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(255, 255, 255, 0.06);
      --yellow-primary: #facc15; /* Modern Vibrant Yellow */
      --yellow-hover: #eab308;
      --text-white: #ffffff;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .checkout-container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2.5rem;
    }

    /* Section Title */
    .section-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-header i {
      color: var(--yellow-primary);
    }

    /* Glass Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Cart Items List */
    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .cart-item {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .cart-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .item-img {
      width: 90px;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--card-border);
    }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .item-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--yellow-primary);
      margin-top: 0.25rem;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--text-white);
      cursor: pointer;
      font-size: 1rem;
      width: 24px;
      height: 24px;
    }

    .qty-val {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      margin-left: 0.5rem;
      transition: opacity 0.2s;
    }

    .remove-btn:hover {
      opacity: 0.8;
    }

    /* Summary Card & Payment */
    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .summary-line.total {
      border-top: 1px solid var(--card-border);
      padding-top: 1.25rem;
      margin-top: 1.25rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .summary-line.total .total-price {
      color: var(--yellow-primary);
    }

    /* Coupon Input */
    .coupon-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .coupon-box input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-white);
      outline: none;
    }

    .coupon-box button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .coupon-box button:hover {
      border-color: var(--yellow-primary);
      color: var(--yellow-primary);
    }

    .btn-checkout {
      width: 100%;
      background-color: var(--yellow-primary);
      color: #000000;
      border: none;
      padding: 1.1rem;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-checkout:hover {
      background-color: var(--yellow-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
    }

    .payment-icons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 1.5rem;
    }

    @media (max-width: 850px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="checkout-container">

    <!-- Left Column: Shopping Bag Items -->
    <div>
      <h2 class="section-header">
        <i class="fa-solid fa-bag-shopping"></i> Shopping Bag (2 Items)
      </h2>
      
      <div class="glass-card">
        <div class="cart-items-list">
          
          <!-- Item 1 -->
          <div class="cart-item">
            <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&q=80&w=200" alt="Classic Overshirt" class="item-img">
            <div class="item-details">
              <div class="item-title">Classic Overshirt</div>
              <div class="item-meta">Color: Slate Grey | Size: M</div>
              <div class="item-price">$59.00</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
              <span class="qty-val">1</span>
              <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
            <button class="remove-btn" title="Remove item"><i class="fa-regular fa-trash-can"></i></button>
          </div>

          <!-- Item 2 -->
          <div class="cart-item">
            <img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&q=80&w=200" alt="Vintage Denim Overshirt" class="item-img">
            <div class="item-details">
              <div class="item-title">Vintage Denim Overshirt</div>
              <div class="item-meta">Color: Dark Wash | Size: L</div>
              <div class="item-price">$35.00</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
              <span class="qty-val">1</span>
              <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
            <button class="remove-btn" title="Remove item"><i class="fa-regular fa-trash-can"></i></button>
          </div>

        </div>
      </div>
    </div>

    <!-- Right Column: Order Summary & Checkout -->
    <div>
      <h2 class="section-header">
        <i class="fa-solid fa-receipt"></i> Order Summary
      </h2>

      <div class="glass-card">
        <!-- Promo Code Input -->
        <div class="coupon-box">
          <input type="text" placeholder="Promo / Gift Code">
          <button>Apply</button>
        </div>

        <div class="summary-line">
          <span>Subtotal</span>
          <span>$94.00</span>
        </div>
        <div class="summary-line">
          <span>Estimated Shipping</span>
          <span>$5.00</span>
        </div>
        <div class="summary-line">
          <span>Tax</span>
          <span>$0.00</span>
        </div>

        <div class="summary-line total">
          <span>Total</span>
          <span class="total-price">$99.00</span>
        </div>

        <button class="btn-checkout" onclick="alert('Proceeding to Secure Checkout!')">
          <i class="fa-solid fa-lock"></i> Proceed to Checkout
        </button>

        <div class="payment-icons">
          <i class="fa-brands fa-cc-visa" title="Visa"></i>
          <i class="fa-brands fa-cc-mastercard" title="Mastercard"></i>
          <i class="fa-brands fa-cc-apple-pay" title="Apple Pay"></i>
        </div>
      </div>
    </div>

  </div>

  <script>
    function updateQty(btn, change) {
      const qtySpan = btn.parentElement.querySelector('.qty-val');
      let val = parseInt(qtySpan.innerText) + change;
      if (val >= 1) {
        qtySpan.innerText = val;
      }
    }
  </script>

</body>
</html>
